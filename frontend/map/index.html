<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link rel="stylesheet" href="{{ url_for('static', path='map/map.css') }}" />

</head>
<body>
    <div id="map"></div>

    <div id="timeserie-control">
        <div class="timeserie-container-vertical">
            <div id="status-bar" class="timeserie-container-horizontal">
                <div id="status-download">
{#                    <img id="loading-icon" class="status-icon" src="{{ url_for('static', path='assets/loading.gif') }}" alt="Loading animation">#}
                    <img id="ready-icon" class="status-icon" src="{{ url_for('static', path='assets/ready_placeholder.svg') }}" alt="Loading animation">
                    <p id="timeserie-curDate">Loading...</p>
                </div>

            </div>

            <div class="timeserie-container-vertical">
                <label for="timeserie-slider"> Available observations:</label>
                <input type="range" id="timeserie-slider" min="0" max="0" value="0" step="1" />
            </div>
        </div>


    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <script>
        var initBounds = {{ bounds | tojson if bounds is defined else 'null'}} ?? [[40.712, -74.227], [40.774, -74.125]];
        const availableKeys = {{ availableKeyes | tojson if availableKeyes is defined else "null" }}
        const availableTimes = {{ availableTimes | tojson if availableTimes is defined else "null" }}
    </script>
    <script src="{{ url_for('static', path='map/map.js') }}"></script>
</body>
</html>
